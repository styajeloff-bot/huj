services:
  postgres:
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: postgres

  backend:
    environment:
      LOG_LEVEL: INFO
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: carcraft-api

  event-worker:
    expose:
      - "8000"
    environment:
      LOG_LEVEL: INFO
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: carcraft-event-worker

  taskiq-worker:
    # Keep the image ENTRYPOINT: one exporter aggregates all Taskiq children.
    expose:
      - "8000"
    environment:
      LOG_LEVEL: INFO
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: carcraft-taskiq-worker

  taskiq-scheduler:
    environment:
      LOG_LEVEL: INFO
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: carcraft-taskiq-scheduler

  redis:
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: redis

  clickhouse:
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: clickhouse

  redpanda:
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: redpanda

  frontend:
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: carcraft-frontend

  redpanda-console:
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: redpanda-console

  nginx:
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: carcraft-nginx

  loki:
    image: grafana/loki:3.4.2
    profiles: [observability]
    command: ["-config.file=/etc/loki/local-config.yml"]
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/local-config.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.5
    profiles: [observability]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    expose:
      - "12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Local opt-in only. A read-only bind prevents filesystem writes, but
      # Docker API access is still privileged and must not be used on servers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      # The minimal Alloy image has no HTTP client. The container runtime
      # already tracks process liveness; this validates the loaded config.
      test: ["CMD", "/bin/alloy", "fmt", "--test", "/etc/alloy/config.alloy"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    profiles: [observability]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  observability-smoke:
    image: alpine:3.21.3
    profiles: [observability-smoke]
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: carcraft-api
    environment:
      SMOKE_MARKER: ${SMOKE_MARKER:-local_observability_smoke}
    volumes:
      - ./monitoring/smoke-fixture.sh:/usr/local/bin/smoke-fixture:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/smoke-fixture"]
    depends_on:
      alloy:
        condition: service_healthy
    restart: "no"

  observability-native-smoke:
    image: alpine:3.21.3
    profiles: [observability-smoke]
    labels:
      com.carcraft.observability: "true"
      com.carcraft.service_name: ${SMOKE_SERVICE_NAME:-postgres}
    environment:
      SMOKE_MARKER: ${SMOKE_MARKER:-local_observability_smoke_native}
      SMOKE_NATIVE_FORMAT: ${SMOKE_NATIVE_FORMAT:-known}
      SMOKE_SERVICE_NAME: ${SMOKE_SERVICE_NAME:-postgres}
    volumes:
      - ./monitoring/native-smoke-fixture.sh:/usr/local/bin/native-smoke-fixture:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/native-smoke-fixture"]
    depends_on:
      alloy:
        condition: service_healthy
    restart: "no"

volumes:
  loki_data:
  alloy_data:
  grafana_data:
