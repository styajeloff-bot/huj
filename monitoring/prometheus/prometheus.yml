global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics

  - job_name: 'fastapi'
    static_configs:
      - targets: ['backend:3002']
    metrics_path: /metrics

  - job_name: 'event-worker'
    static_configs:
      - targets: ['event-worker:8000']
    metrics_path: /metrics

  - job_name: 'taskiq-worker'
    static_configs:
      - targets: ['taskiq-worker:8000']
    metrics_path: /metrics
